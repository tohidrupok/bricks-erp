<!-- Firebase code -->

<script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-messaging.js"></script>

<script>
  const firebaseConfig = {
      apiKey: "AIzaSyDL9PqSlhQL3iW2WCDZ8hapiMO-GO94I4A",
      authDomain: "erpmessage-d7ad1.firebaseapp.com",
      projectId: "erpmessage-d7ad1",
      storageBucket: "erpmessage-d7ad1.firebasestorage.app",
      messagingSenderId: "136688303447",
      appId: "1:136688303447:android:2a6ac7e9441dc22920d212"
    };


  const app = firebase.initializeApp(firebaseConfig);
  const messaging = firebase.messaging();

  messaging
    .requestPermission()
    .then(() => messaging.getToken())
    .then((token) => {
      console.log("FCM Token:", token);
      // Save token to Django
      fetch("/save-fcm-token/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": "{{ csrf_token }}",
        },
        body: JSON.stringify({ token: token }),
      });
    });

  // Receive push notifications
  messaging.onMessage((payload) => {
    console.log("Push received", payload);

    // 🔔 Update the bell icon counter dynamically
    let counter = document.getElementById("notifCount");
    if (counter) {
      counter.innerText = parseInt(counter.innerText || "0") + 1;
      counter.classList.remove("hidden");
    }

    // Optional popup alert
    new Notification(payload.notification.title, {
      body: payload.notification.body,
    });
  });
</script>
