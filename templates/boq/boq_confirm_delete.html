<!-- boq_confirm_delete.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete BOQ Item</title>
</head>
<body>
    <h1>Are you sure you want to delete the BOQ item: {{ boq.item_name }}?</h1>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirm Deletion</button>
    </form>

    <a href="{% url 'boq_list' %}">Cancel</a>
</body>
</html>
