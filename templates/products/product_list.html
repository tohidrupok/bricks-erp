<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
</head>
<body>
    <h1>Product List</h1>
    <a href="{% url 'add_product' %}">Add New Product</a>
    <table border="1">
        <thead>
            <tr>
                <th>Product Name</th>
                <th>Product Type</th>
                <th>Quantity</th>
                <th>Unit</th>
                <th>Rate</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody>
            {% for product in products %}
                <tr>
                    <td>{{ product.product_name }}</td>
                    <td>{{ product.product_type }}</td>
                    <td>{{ product.quantity }}</td>
                    <td>{{ product.unit }}</td>
                    <td>{{ product.rate }}</td>
                    <td>{{ product.amount }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
