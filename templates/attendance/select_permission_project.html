{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow-lg">

<div class="card-header bg-success text-white">

<h4>Select Project</h4>

</div>

<div class="card-body">

<form method="post">

{% csrf_token %}

<div class="mb-4">

<label class="form-label">

Project

</label>

<select
name="project"
class="form-select"
required>

<option value="">

Select Project

</option>

{% for project in projects %}

<option value="{{ project.id }}">

{{ project.project_first_name }}

</option>

{% endfor %}

</select>

</div>

<button
class="btn btn-success w-100">

Continue

</button>

</form>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
