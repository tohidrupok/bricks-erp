{% extends 'restaurant/base.html' %}
{% block content %}
<div class="max-w-xl mx-auto bg-white p-8 rounded-lg shadow-sm border">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">{{ title }}</h2>
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<p class="text-red-500 text-xs mt-1">{{ field.errors.as_text }}</p>{% endif %}
            </div>
        {% endfor %}
        <div class="flex gap-4 pt-4">
            <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded font-medium hover:bg-blue-700">Save Configuration</button>
            <a href="{% url 'approval_range_list' %}" class="border bg-gray-50 px-6 py-2 rounded text-gray-700 hover:bg-gray-100">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
