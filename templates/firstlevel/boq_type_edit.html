<!-- templates/property_list.html -->
{% extends 'base.html' %}
{% load static %}

{% block title %}BOQ Type Edit - BM ERP{% endblock %}

{% block content %} 
    <div class="rubick px-5 sm:px-8 py-5 before:content-[''] before:bg-gradient-to-b before:from-theme-1 before:to-theme-2 dark:before:from-darkmode-800 dark:before:to-darkmode-800 before:fixed before:inset-0 before:z-[-1]">
        <!-- BEGIN: Mobile Menu -->
        {% include 'partials/mobile.html' %}
        <!-- END: Mobile Menu -->
        <div class="mt-[4.7rem] flex md:mt-0">
            <!-- BEGIN: Side Menu -->
            {% include 'partials/sidebar_list.html' %}
            <!-- END: Side Menu -->
            <!-- BEGIN: Content -->
            <div class="md:max-w-auto min-h-screen min-w-0 max-w-full flex-1 rounded-[30px] bg-slate-100 px-4 pb-10 before:block before:h-px before:w-full before:content-[''] dark:bg-darkmode-700 md:px-[22px]">
                <!-- BEGIN: Top Bar -->  
				{% include 'partials/header.html' %}
                
                <!-- END: Top Bar -->
                <h2 class="intro-y mt-10 text-lg font-medium">BOQ Type Edit</h2>					
                    <a href="{% url 'create_boq_type' %}">
                        <button data-tw-merge="" class="transition duration-200 border inline-flex items-center justify-center py-2 px-3 rounded-md font-medium cursor-pointer focus:ring-4 focus:ring-primary focus:ring-opacity-20 focus-visible:outline-none dark:focus:ring-slate-700 dark:focus:ring-opacity-50 bg-success border-success text-white mr-2 shadow-md">Refresh</button>
                    </a> 
					<div class="mt-5 grid grid-cols-12 gap-6">
						<div class="intro-y col-span-12 overflow-auto lg:overflow-visible p-5">						 
						 <form method="post">{% csrf_token %}
							<div class="mb-4">
								<label class="block mb-2 text-gray-700">BoQ Type Name</label>
								<input type="text" name="boq_type_name" value="{{ boq_type.boq_type_name }}" required
									   class="w-full border-gray-300 rounded px-3 py-2 focus:ring-blue-300">
							</div>
							<button type="submit"  style="background-color:#1e3c98"
									class="bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded">Update</button>
							<a href="{% url 'boq_type_list' %}" style="margin-left:0.5%;background-color:#1e3c98" class="bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded">Cancel</a>
						</form>

                        <br>  
                    </div>
                    
                    
                </div>
           
            </div>
            <!-- END: Content -->
        </div>
    </div>
{% endblock %}
