{% extends 'office_inventory/base.html' %}

{% block header %}{{ title }}{% endblock %}

{% block content %}
   <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f6f9; margin: 40px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; margin-top: 0; margin-bottom: 20px;}
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        .form-input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        .form-input:focus { border-color: #3498db; outline: none; }
        .btn-group { display: flex; gap: 10px; margin-top: 25px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 5px; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; }
        .btn-save { background-color: #2ecc71; color: white; }
        .btn-cancel { background-color: #95a5a6; color: white; }
    </style>
<div class="card card-stat p-3" style="max-width: 600px; margin: 0 auto;">
    <div class="card-header mb-3">
        <h2>{{ title }}</h2>
    </div>
    
    <form method="post" id="departmentForm" data-employees-url="{% url 'office_inventory:ajax_load_employees' %}" novalidate>
        {% csrf_token %}
        
        {% for field in form %}
            <div class="form-group mb-3" id="group_{{ field.name }}">
                <label class="form-label font-weight-bold" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                {% endif %}
            </div>
        {% endfor %}

        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-success flex-grow-1">Save Department</button>
            <a href="{% url 'office_inventory:department_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<!-- jQuery for Dynamic Dependent Dropdown -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function() {
        // Hide project dropdown initially unless restaurant is pre-selected
        if($('#id_dept_type').val() !== 'restaurant') {
            $('#group_restaurant_project').hide();
        }

        $('#id_dept_type').change(function () {
            var url = $("#departmentForm").attr("data-employees-url");
            var deptType = $(this).val();

            if (deptType === 'restaurant') {
                $('#group_restaurant_project').show();
            } else {
                $('#group_restaurant_project').hide();
                $('#id_restaurant_project').val('');
            }

            $.ajax({
                url: url,
                data: {
                    'dept_type': deptType
                },
                success: function (data) {
                    var html = '<option value="">---------</option>';
                    data.employees.forEach(function (emp) {
                        html += '<option value="' + emp.id + '">' + emp.name + '</option>';
                    });
                    $("#id_manager").html(html);
                }
            });
        });
    });
</script>
{% endblock %}
