{% extends 'office_inventory/base.html' %}

{% block header %}Category Details{% endblock %}

{% block content %}
<div class="card card-stat p-3" style="max-width: 600px; margin: 0 auto;">
    <div class="card-header mb-3">
        <h2>Category Profile</h2>
    </div>
    
    <div class="data-row mb-2">
        <span class="label font-weight-bold text-muted" style="width: 120px; display: inline-block;">Category ID:</span>
        <span class="value">{{ category.id }}</span>
    </div>
    <div class="data-row mb-3">
        <span class="label font-weight-bold text-muted" style="width: 120px; display: inline-block;">Name:</span>
        <span class="value"><strong>{{ category.name }}</strong></span>
    </div>
    
    <hr>
    
    <div class="footer-links d-flex gap-2">
        <a href="{% url 'office_inventory:category_update' category.pk %}" class="btn btn-warning">Modify Details</a>
        <a href="{% url 'office_inventory:category_list' %}" class="btn btn-secondary">Back to List</a>
    </div>
</div>
{% endblock %}
