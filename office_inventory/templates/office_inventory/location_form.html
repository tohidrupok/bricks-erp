{% extends 'office_inventory/base.html' %}

{% block header %}{{ title }}{% endblock %}

{% block content %}
<div class="card card-stat p-3" style="max-width: 600px; margin: 0 auto;">
    <div class="card-header mb-3">
        <h2>{{ title }}</h2>
    </div>
    
    <form method="post" novalidate>
        {% csrf_token %}
        
        {% for field in form %}
            <div class="form-group mb-3">
                <label class="form-label font-weight-bold" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                {% endif %}
            </div>
        {% endfor %}

        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-success flex-grow-1">Save Location</button>
            <a href="{% url 'office_inventory:location_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
