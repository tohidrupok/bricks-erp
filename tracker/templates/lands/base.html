<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Land Inheritance Tracker | জমি উত্তরাধিকার ট্র্যাকার{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f6f5f1;
      --surface: #ffffff;
      --surface-alt: #faf9f6;
      --border: #e2e0d8;
      --border-strong: #c8c5bb;
      --text: #1e1d1a;
      --text-2: #5a5854;
      --text-3: #8c8a85;
      --accent: #2d6a4f;
      --accent-bg: #e8f5ee;
      --accent-border: #a8d5b8;
      --accent-text: #1a4a35;
      --danger: #c0392b;
      --danger-bg: #fdf0ef;
      --warning: #d97706;
      --warning-bg: #fffbeb;
      --radius: 10px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,.1), 0 2px 4px rgba(0,0,0,.06);
    }

    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; line-height: 1.6; }

    /* Nav */
    .nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; gap: 8px; height: 56px; position: sticky; top: 0; z-index: 100; }
    .nav-brand { font-weight: 700; font-size: 15px; color: var(--accent); display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .nav-brand svg { width: 20px; height: 20px; }
    .nav-brand .bn { font-size: 12px; color: var(--text-3); font-weight: 400; }
    .nav-spacer { flex: 1; }
    .nav a { color: var(--text-2); text-decoration: none; font-size: 14px; padding: 6px 12px; border-radius: 6px; }
    .nav a:hover { background: var(--bg); color: var(--text); }

    /* Container */
    .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
    .container-sm { max-width: 720px; margin: 0 auto; padding: 32px 24px; }

    /* Page header */
    .page-header { margin-bottom: 28px; }
    .page-header h1 { font-size: 24px; font-weight: 700; color: var(--text); }
    .page-header .subtitle { color: var(--text-2); font-size: 14px; margin-top: 4px; }
    .page-header .bn-title { font-size: 13px; color: var(--text-3); }

    /* Cards */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; box-shadow: var(--shadow); }
    .card + .card { margin-top: 16px; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid transparent; text-decoration: none; transition: all .15s; white-space: nowrap; }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { background: #235a40; border-color: #235a40; }
    .btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
    .btn-secondary:hover { background: var(--bg); }
    .btn-danger { background: var(--danger-bg); color: var(--danger); border-color: #f5c6c3; }
    .btn-danger:hover { background: #fde8e6; }
    .btn-sm { padding: 5px 11px; font-size: 13px; }
    .btn-xs { padding: 3px 8px; font-size: 12px; border-radius: 6px; }

    /* Form fields */
    .form-group { margin-bottom: 18px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
    label .bn-label { font-weight: 400; color: var(--text-3); margin-left: 6px; }
    input[type=text], input[type=date], textarea, select {
      width: 100%; padding: 9px 12px; border: 1px solid var(--border-strong); border-radius: 8px;
      font-size: 14px; background: var(--surface); color: var(--text);
      transition: border-color .15s, box-shadow .15s; font-family: inherit;
    }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(45,106,79,.12); }
    textarea { resize: vertical; min-height: 80px; }

    /* Table */
    .table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; background: var(--surface); }
    thead { background: var(--bg); }
    th { padding: 10px 14px; text-align: left; font-size: 12px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .03em; border-bottom: 1px solid var(--border); }
    td { padding: 12px 14px; font-size: 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg); }

    /* Badge */
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 500; }
    .badge-green { background: var(--accent-bg); color: var(--accent-text); }
    .badge-gray { background: #f0ede8; color: var(--text-2); }

    /* Alerts */
    .alert { padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
    .alert-success { background: var(--accent-bg); color: var(--accent-text); border: 1px solid var(--accent-border); }
    .alert-error { background: var(--danger-bg); color: var(--danger); border: 1px solid #f5c6c3; }

    /* Actions row */
    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }

    /* Empty state */
    .empty { text-align: center; padding: 48px 24px; color: var(--text-2); }
    .empty svg { opacity: .3; margin-bottom: 12px; }
    .empty h3 { font-size: 16px; margin-bottom: 6px; }
    .empty p { font-size: 14px; }

    /* Breadcrumb */
    .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-3); margin-bottom: 20px; }
    .breadcrumb a { color: var(--accent); text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }

    /* Meta grid */
    .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .meta-item { background: var(--bg); border-radius: 8px; padding: 12px 14px; border: 1px solid var(--border); }
    .meta-item .label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text-3); margin-bottom: 4px; }
    .meta-item .value { font-size: 15px; font-weight: 600; color: var(--text); }

    @media (max-width: 640px) {
      .form-row { grid-template-columns: 1fr; }
      .container, .container-sm { padding: 20px 16px; }
      .nav { padding: 0 16px; }
    }
    
    .back-btn {
    background: #64748b;
    color: white !important;
    padding: 6px 12px;
    border-radius: 6px;
}

.back-btn:hover {
    background: #475569;
}

  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
<nav class="nav">
  <a href="{% url 'tracker:list' %}" class="nav-brand">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M3 17l4-4 4 4 6-6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M2 10V5a1 1 0 011-1h14a1 1 0 011 1v5" stroke-linecap="round"/>
      <rect x="6" y="12" width="8" height="6" rx="1"/>
    </svg>
    Land Tracker
    <span class="bn">জমি ট্র্যাকার</span>
  </a>

  <div class="nav-spacer"></div>

  <!-- Back Button -->
  <a href="{% url 'dashboard' %}">
    ← Back
  </a>

  <a href="{% url 'tracker:list' %}">Records</a>
  <a href="{% url 'tracker:create' %}">+ New</a>
</nav>

<div>
  {% if messages %}
    <div style="max-width:1100px;margin:16px auto;padding:0 24px">
      {% for msg in messages %}
        <div class="alert alert-{% if msg.tags == 'error' %}error{% else %}success{% endif %}">{{ msg }}</div>
      {% endfor %}
    </div>
  {% endif %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
