{% extends "lands/base.html" %}
{% block content %}
<div class="container-sm">
  <div class="card" style="text-align:center;padding:36px">
    <div style="width:48px;height:48px;background:var(--danger-bg);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
      <svg width="22" height="22" fill="none" stroke="var(--danger)" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h2 style="font-size:18px;margin-bottom:8px">Delete "{{ owner.name }}"?</h2>
    <p style="color:var(--text-2);margin-bottom:6px">This will also delete all their heirs/children in the tree.</p>
    <p style="font-size:13px;color:var(--text-3);margin-bottom:24px">এই ব্যক্তি এবং তার সকল উত্তরাধিকারীর তথ্য মুছে যাবে।</p>
    <div style="display:flex;gap:10px;justify-content:center">
      <form method="post" style="display:inline">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
      </form>
      <a href="{% url 'tracker:detail' record.pk %}" class="btn btn-secondary">Cancel</a>
    </div>
  </div>
</div>
{% endblock %}
